<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#04060c" />

  <!-- circle viz: radiating spectrum bars -->
  <g stroke-linecap="round">
    <line x1="50" y1="6"  x2="50" y2="14" stroke="hsl(190,70%,62%)" stroke-width="3.4" />
    <line x1="72.6" y1="11.7" x2="68.7" y2="18.6" stroke="hsl(202,70%,62%)" stroke-width="3.4" />
    <line x1="88.3" y1="27.4" x2="81.4" y2="31.3" stroke="hsl(214,70%,62%)" stroke-width="3.4" />
    <line x1="94" y1="50" x2="86" y2="50" stroke="hsl(226,70%,62%)" stroke-width="3.4" />
    <line x1="88.3" y1="72.6" x2="81.4" y2="68.7" stroke="hsl(238,68%,64%)" stroke-width="3.4" />
    <line x1="72.6" y1="88.3" x2="68.7" y2="81.4" stroke="hsl(280,55%,64%)" stroke-width="3.4" />
    <line x1="50" y1="94" x2="50" y2="86" stroke="hsl(310,55%,64%)" stroke-width="3.4" />
    <line x1="27.4" y1="88.3" x2="31.3" y2="81.4" stroke="hsl(330,60%,64%)" stroke-width="3.4" />
    <line x1="11.7" y1="72.6" x2="18.6" y2="68.7" stroke="hsl(346,60%,64%)" stroke-width="3.4" />
    <line x1="6" y1="50" x2="14" y2="50" stroke="hsl(2,60%,62%)" stroke-width="3.4" />
    <line x1="11.7" y1="27.4" x2="18.6" y2="31.3" stroke="hsl(18,60%,62%)" stroke-width="3.4" />
    <line x1="27.4" y1="11.7" x2="31.3" y2="18.6" stroke="hsl(190,70%,62%)" stroke-width="3.4" />
  </g>

  <!-- flower: 6-petal rosette -->
  <g fill="rgba(255,126,179,0.55)">
    <ellipse cx="74" cy="50"   rx="8" ry="4" transform="rotate(0 74 50)" />
    <ellipse cx="62" cy="71.8" rx="8" ry="4" transform="rotate(60 62 71.8)" />
    <ellipse cx="38" cy="71.8" rx="8" ry="4" transform="rotate(120 38 71.8)" />
    <ellipse cx="26" cy="50"   rx="8" ry="4" transform="rotate(0 26 50)" />
    <ellipse cx="38" cy="28.2" rx="8" ry="4" transform="rotate(60 38 28.2)" />
    <ellipse cx="62" cy="28.2" rx="8" ry="4" transform="rotate(120 62 28.2)" />
  </g>

  <!-- Qian ☰ (Heaven) trigram: three solid yang bars -->
  <g fill="#e8c876">
    <rect x="34" y="30" width="32" height="7" rx="1.6" />
    <rect x="34" y="46.5" width="32" height="7" rx="1.6" />
    <rect x="34" y="63" width="32" height="7" rx="1.6" />
  </g>
</svg>
